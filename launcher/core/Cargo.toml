[package]
name = "fbm-core"
version = "1.0.0"
edition = "2021"
description = "Moteur de mise à jour différentielle du launcher FiveM Base Manager"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
regex = "1"

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"
