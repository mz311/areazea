# Reverse proxy HTTPS pour FiveM Base Manager (remplacez base.example.com et les chemins des certificats).
server {
    listen 80;
    server_name base.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name base.example.com;

    ssl_certificate     /etc/letsencrypt/live/base.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/base.example.com/privkey.pem;

    # Upload de l'archive de la base (doit être >= MAX_UPLOAD_MB)
    client_max_body_size 4g;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # IMPORTANT : l'application se fie à X-Real-IP pour la limitation de débit et le journal d'audit.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }

    # Upload en flux (pas de mise en tampon sur disque par nginx) et longs délais pour les grosses archives
    location = /api/admin/versions/upload {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
    }
}
