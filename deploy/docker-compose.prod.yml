# Surcouche de production : Caddy en frontal (HTTPS Let's Encrypt automatique) devant le site.
# Utilisé par deploy/install.sh :  docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro # généré par install.sh
      - caddy_data:/data # certificats : à conserver
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
